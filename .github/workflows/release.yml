name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin package
        run: |
          mkdir -p dist/tailscale-swiftbar
          cp tailnet.10s.py install.sh README.md LICENSE CHANGELOG.md dist/tailscale-swiftbar/
          cd dist
          zip -r "tailscale-swiftbar-${GITHUB_REF_NAME}.zip" tailscale-swiftbar
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "${GITHUB_REF_NAME}" --generate-notes
